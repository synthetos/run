{
  "name": "database-backups",
  "on": {
    "schedule": [
      {
        "cron": "45 7 * * *"
      }
    ],
    "workflow_dispatch": {
      "inputs": {
        "environment": {
          "type": "choice",
          "options": [
            "staging",
            "production"
          ],
          "default": "staging",
          "required": true
        },
        "restore_test": {
          "type": "boolean",
          "default": false,
          "description": "Also verify a scratch restore now"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "backup-staging": {
      "if": "github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.environment == 'staging')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "environment": "staging",
      "permissions": {
        "contents": "read"
      },
      "concurrency": {
        "group": "run-database-backups",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "run": "corepack enable"
        },
        {
          "run": "pnpm --dir ci/deploy-toolchain install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Export, verify upload and optionally restore scratch",
          "run": "node tools/backups/cli.mjs",
          "env": {
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}",
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_D1_API_TOKEN": "${{ secrets.CLOUDFLARE_D1_API_TOKEN }}",
            "BACKUP_ENV": "staging",
            "RESTORE_TEST": "${{ inputs.restore_test }}"
          }
        }
      ]
    },
    "backup-production": {
      "if": "always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.environment == 'production')",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "environment": "production",
      "permissions": {
        "contents": "read"
      },
      "concurrency": {
        "group": "run-database-backups",
        "cancel-in-progress": false
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "22.22.0",
            "package-manager-cache": false
          }
        },
        {
          "run": "corepack enable"
        },
        {
          "run": "pnpm --dir ci/deploy-toolchain install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Export, verify upload and optionally restore scratch",
          "run": "node tools/backups/cli.mjs",
          "env": {
            "CLOUDFLARE_ACCOUNT_ID": "${{ vars.CLOUDFLARE_ACCOUNT_ID }}",
            "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
            "CLOUDFLARE_D1_API_TOKEN": "${{ secrets.CLOUDFLARE_D1_API_TOKEN }}",
            "BACKUP_ENV": "production",
            "RESTORE_TEST": "${{ inputs.restore_test }}"
          }
        }
      ],
      "needs": "backup-staging"
    }
  }
}
