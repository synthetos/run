# The `safety-review` check (ROADMAP P0-03, SAFETY §8, DECISIONS D40).
#
# A pull request that touches a safety-review path
# (tools/gates/src/shared/safetyPaths.ts) passes only with:
# - the SAFETY §8 checklist from .github/pull_request_template.md fully
#   ticked;
# - its recorded independent review, docs/safety/reviews/pr-<N>.md, read at
#   the head commit: approving, with no open findings, listing every safety
#   path the PR touches, naming a reviewer other than the author, and bound
#   to the head (GitHub's compare of the reviewed commit with the head shows
#   only the record changed after it) (tools/gates/src/review/reviewRecord.ts);
# - REQUIRED_SAFETY_APPROVALS approvals of the head commit from reviewers
#   other than the author who hold write, maintain or admin permission on
#   this repository NOW (GET /repos/{owner}/{repo}/collaborators/{username}/
#   permission, never author_association). D40: zero while the owner is the
#   only maintainer, because GitHub never lets authors approve their own PRs;
#   two again when a second maintainer joins, by changing one line in
#   tools/gates/src/review/reviewPolicy.ts.
# Branch protection makes this a required check (docs/ops/branch-protection.md).
#
# The gate code is checked out from the PR's BASE commit. This file itself is
# not: a pull_request workflow runs the definition from the PR, so a PR can
# rewrite this file (and the policy that checks it). This check is therefore
# a SECONDARY control. The primary control is GitHub's native branch
# protection: the required status checks, the protected deploy environment
# and, once there is a second maintainer, required approvals and Code Owner
# review of .github/ and tools/gates/ (docs/ops/branch-protection.md). The
# check holds no secret and only read permissions; the PR body reaches the
# script through env:.

name: safety-review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

concurrency:
  group: safety-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  safety-review:
    name: safety-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the base commit (the reviewed gate code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Fetch the changed files, the reviews and the description
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --slurp > "$RUNNER_TEMP/files.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate --slurp > "$RUNNER_TEMP/reviews.json"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.md"
      - name: Fetch each reviewer's current permission on this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One answer per reviewer. A reviewer whose answer cannot be fetched has no
          # evidence of write access, and the gate does not count their approval.
          : > "$RUNNER_TEMP/permissions.jsonl"
          for login in $(jq -r '.[][] | .user.login // empty' "$RUNNER_TEMP/reviews.json" | sort -u); do
            if ! printf '%s' "$login" | grep -Eq '^[A-Za-z0-9-]+(\[bot\])?$'; then
              echo "::warning::skipping an unexpected reviewer login"
              continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/collaborators/$login/permission" > "$RUNNER_TEMP/permission.json"; then
              cat "$RUNNER_TEMP/permission.json" >> "$RUNNER_TEMP/permissions.jsonl"
            else
              echo "::warning::no permission answer for $login: their approval does not count"
            fi
          done
          jq -s . "$RUNNER_TEMP/permissions.jsonl" > "$RUNNER_TEMP/permissions.json"
      - name: Fetch the independent review record and compare its reviewed commit with the head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # D40. A missing record, or one whose reviewed commit cannot be compared,
          # leaves an empty record or a null comparison, and the gate refuses it.
          record="docs/safety/reviews/pr-$PR_NUMBER.md"
          if ! gh api -H "Accept: application/vnd.github.raw+json" "repos/$GITHUB_REPOSITORY/contents/$record?ref=$HEAD_SHA" > "$RUNNER_TEMP/review-record.md"; then
            echo "::warning::no review record at $record in the head commit"
            : > "$RUNNER_TEMP/review-record.md"
          fi
          echo null > "$RUNNER_TEMP/review-compare.json"
          reviewed=$(sed -n 's/^- Reviewed commit: *\([0-9a-f]\{40\}\) *$/\1/p' "$RUNNER_TEMP/review-record.md" | head -n 1)
          if [ -n "$reviewed" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/compare/$reviewed...$HEAD_SHA" > "$RUNNER_TEMP/review-compare.json"; then
              echo "::warning::could not compare the reviewed commit with the head"
              echo null > "$RUNNER_TEMP/review-compare.json"
            fi
          fi
      - name: Check the checklist, the review record and the approvals of reviewers with write access
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node tools/gates/src/review/cli.ts \
            --files "$RUNNER_TEMP/files.json" \
            --reviews "$RUNNER_TEMP/reviews.json" \
            --permissions "$RUNNER_TEMP/permissions.json" \
            --body-file "$RUNNER_TEMP/body.md" \
            --author "$PR_AUTHOR" \
            --head-sha "$HEAD_SHA" \
            --pr "$PR_NUMBER" \
            --record "$RUNNER_TEMP/review-record.md" \
            --record-compare "$RUNNER_TEMP/review-compare.json"
