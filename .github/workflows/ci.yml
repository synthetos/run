# CI for synthetos/run (ROADMAP P0-03, RUN_PLAN §6.2, SAFETY H12, H46).
#
# Jobs and what they may hold:
#   verify             secret-free. Installs every devDependency and runs the
#                      typecheck, lint, boundary, licence, CI-policy and unit
#                      test gates. Runs on every pull request and push.
#   build              secret-free, no write permission. Installs ONLY the
#                      production build toolchain from a lockfile subset,
#                      builds the web bundle and the Worker script twice from
#                      two clean checkouts, fails unless the outputs are
#                      byte-identical, runs the bundle scan and uploads the
#                      artifact (run-web.tar and run-worker.tar, each with a
#                      sha256 manifest).
#   e2e                secret-free. Verifies the uploaded artifact against its
#                      manifests, runs the Playwright suite against wrangler
#                      dev serving that artifact under the origin guard
#                      (headers, CSP, Trusted Types, no external origin;
#                      T-S25), then the third-party canary, which must see
#                      the suite fail on a planted third-party URL (P0-06).
#   attest             main pushes only. Signs build provenance for the
#                      artifact. Runs no repository code, so it is the only
#                      job holding id-token: write.
#
# Every job that downloads the artifact (e2e, e2e-fake-serial, attest and
# both deploys) first checks each file against the sha256 the build job
# published as its outputs (only the build job can set them), so an artifact
# replaced under the same name by another job of the run is never attested,
# tested or deployed (artifact poisoning; `artifact-digest` in ci-policy).
#   deploy-staging     main pushes only, protected environment `staging`.
#   deploy-production  main pushes only, protected environment `production`
#                      (the owner is a required reviewer).
#                      Both deploy ONLY the attested artifact (the Worker with
#                      --no-bundle), after the preflight (D39 account, H45
#                      settings, no custom build; it writes the allowlisted
#                      deployment configuration, the only one wrangler is
#                      given: `deploy-config` in ci-policy), with assets of the previous 14 days merged
#                      in (asset retention, each retained file bound to an
#                      attested build manifest), then run the smoke test
#                      (P0-04). A failure after the deploy step undoes it:
#                      staging is deleted, production rolled back.
#
# Only the two deploy jobs may reference CLOUDFLARE_API_TOKEN (a Workers
# Scripts:Edit token for the run and accounts Workers, D39). `pnpm ci-policy`
# enforces this and the rest of the policy on every run; see
# tools/gates/src/workflow/policy.ts and docs/ops/ci.md.
#
# Rules for editing this file: pin every action to a full commit SHA; pass
# values into scripts through env: (never ${{ }} inside run:); no anchors or
# aliases; no continue-on-error. This file is CODEOWNED.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm through Corepack (version and hash from packageManager)
        run: corepack enable
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Lint
        run: pnpm lint
      - name: Dependency boundaries
        run: pnpm deps
      - name: Licences
        run: pnpm licence
      - name: CI policy (workflows, CODEOWNERS, PR template)
        run: pnpm ci-policy
      - name: Unit tests
        run: pnpm -r test
      - name: Mutation testing (safety, 90% gate)
        run: pnpm --filter @synthetos/safety mutation

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # The sha256 of each artifact file. Only this job can set its outputs, so
    # every consumer checks the downloaded bytes against them: an artifact
    # replaced under the same name by another job of this run (artifact
    # poisoning) fails the check before it is attested, tested or deployed.
    outputs:
      run-web-tar: ${{ steps.digests.outputs.run-web-tar }}
      run-web-manifest: ${{ steps.digests.outputs.run-web-manifest }}
      run-worker-tar: ${{ steps.digests.outputs.run-worker-tar }}
      run-worker-manifest: ${{ steps.digests.outputs.run-worker-manifest }}
    steps:
      - name: Check out (first clean checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: a
          persist-credentials: false
      - name: Check out (second clean checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: b
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: a/.nvmrc
          package-manager-cache: false
      - name: Enable pnpm through Corepack (version and hash from packageManager)
        run: corepack enable
      - name: Install the build toolchain only (first checkout)
        run: node a/tools/gates/src/build/cli.ts install a
      - name: Install the build toolchain only (second checkout)
        run: node b/tools/gates/src/build/cli.ts install b
      - name: Build (first checkout)
        run: pnpm --dir a --filter @synthetos/web build
      - name: Build (second checkout)
        run: pnpm --dir b --filter @synthetos/web build
      - name: Build the Worker script (first checkout)
        run: node a/tools/gates/src/build/worker-cli.ts a/workers/run/src a/dist-worker
      - name: Build the Worker script (second checkout)
        run: node b/tools/gates/src/build/worker-cli.ts b/workers/run/src b/dist-worker
      - name: Reproducible build (outputs must be byte-identical)
        run: |
          node a/tools/gates/src/repro/cli.ts compare a/apps/web/dist b/apps/web/dist
          node a/tools/gates/src/repro/cli.ts compare a/dist-worker b/dist-worker
      - name: Bundle scan
        run: node a/tools/gates/src/bundle/cli.ts a/apps/web/dist
      - name: Package the artifact
        run: |
          mkdir -p artifact
          node a/tools/gates/src/repro/cli.ts manifest a/apps/web/dist artifact/run-web.sha256
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --format=posix \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -cf artifact/run-web.tar -C a/apps/web/dist .
          node a/tools/gates/src/repro/cli.ts manifest a/dist-worker artifact/run-worker.sha256
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --format=posix \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -cf artifact/run-worker.tar -C a/dist-worker .
          sha256sum artifact/run-web.tar artifact/run-web.sha256 artifact/run-worker.tar artifact/run-worker.sha256
      - name: Record the artifact digests as job outputs
        id: digests
        run: |
          set -euo pipefail
          {
            echo "run-web-tar=$(sha256sum artifact/run-web.tar | cut -d' ' -f1)"
            echo "run-web-manifest=$(sha256sum artifact/run-web.sha256 | cut -d' ' -f1)"
            echo "run-worker-tar=$(sha256sum artifact/run-worker.tar | cut -d' ' -f1)"
            echo "run-worker-manifest=$(sha256sum artifact/run-worker.sha256 | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-web
          path: artifact/
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: e2e
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # The extracted artifact (P0-06). Job-level, so every step that starts
    # the suite serves the artifact and never a local build.
    env:
      RUN_E2E_SITE: ${{ github.workspace }}/site
      RUN_E2E_WORKER: ${{ github.workspace }}/worker
    steps:
      # Playwright against wrangler dev serving the artifact that build
      # uploaded (the bytes attest signs and the deploy jobs deploy), then
      # the third-party canary. Secret-free; uploads nothing.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm through Corepack (version and hash from packageManager)
        run: corepack enable
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium for Playwright (version pinned by the lockfile)
        run: pnpm --filter @synthetos/e2e exec playwright install --with-deps chromium
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-web
          path: artifact
      - name: Check the downloaded artifact is the bytes the build job produced
        env:
          RUN_WEB_TAR_SHA256: ${{ needs.build.outputs.run-web-tar }}
          RUN_WEB_MANIFEST_SHA256: ${{ needs.build.outputs.run-web-manifest }}
          RUN_WORKER_TAR_SHA256: ${{ needs.build.outputs.run-worker-tar }}
          RUN_WORKER_MANIFEST_SHA256: ${{ needs.build.outputs.run-worker-manifest }}
        run: |
          set -euo pipefail
          for d in "$RUN_WEB_TAR_SHA256" "$RUN_WEB_MANIFEST_SHA256" "$RUN_WORKER_TAR_SHA256" "$RUN_WORKER_MANIFEST_SHA256"; do
            if ! printf '%s' "$d" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::a build digest is missing or malformed"
              exit 1
            fi
          done
          {
            printf '%s  artifact/run-web.tar\n' "$RUN_WEB_TAR_SHA256"
            printf '%s  artifact/run-web.sha256\n' "$RUN_WEB_MANIFEST_SHA256"
            printf '%s  artifact/run-worker.tar\n' "$RUN_WORKER_TAR_SHA256"
            printf '%s  artifact/run-worker.sha256\n' "$RUN_WORKER_MANIFEST_SHA256"
          } > artifact-digests.txt
          sha256sum --check --strict artifact-digests.txt
      - name: Extract and verify against the manifests
        run: |
          mkdir site worker
          tar -xf artifact/run-web.tar -C site
          node tools/gates/src/repro/cli.ts verify site artifact/run-web.sha256
          tar -xf artifact/run-worker.tar -C worker
          node tools/gates/src/repro/cli.ts verify worker artifact/run-worker.sha256
      - name: Playwright against wrangler dev serving the artifact (T-S25, origin guard)
        run: pnpm --filter @synthetos/e2e e2e
      - name: Third-party canary (a planted third-party URL must fail the suite)
        run: pnpm --filter @synthetos/e2e canary

  e2e-fake-serial:
    name: e2e-fake-serial
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # ROADMAP P0-14 (docs/testing/fake-serial.md). A Playwright init script
      # cannot reach a dedicated worker, so machine.worker is tested with a
      # TEST-ONLY build whose transport seam is a mock port. This job builds
      # it from the same commit, proves it differs from the attested artifact
      # in the seam chunk and nowhere else, then runs the fake-serial suite
      # against it. The test build is never uploaded, attested or deployed.
      # Secret-free; uploads nothing.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm through Corepack (version and hash from packageManager)
        run: corepack enable
      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Chromium for Playwright (version pinned by the lockfile)
        run: pnpm --filter @synthetos/e2e exec playwright install --with-deps chromium
      # Built before anything is added to the checkout, so the build info
      # names the clean commit, exactly as in the attested artifact.
      - name: Build the fake-serial test artifact
        run: pnpm build:fake-serial
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-web
          path: artifact
      - name: Check the downloaded artifact is the bytes the build job produced
        env:
          RUN_WEB_TAR_SHA256: ${{ needs.build.outputs.run-web-tar }}
          RUN_WEB_MANIFEST_SHA256: ${{ needs.build.outputs.run-web-manifest }}
          RUN_WORKER_TAR_SHA256: ${{ needs.build.outputs.run-worker-tar }}
          RUN_WORKER_MANIFEST_SHA256: ${{ needs.build.outputs.run-worker-manifest }}
        run: |
          set -euo pipefail
          for d in "$RUN_WEB_TAR_SHA256" "$RUN_WEB_MANIFEST_SHA256" "$RUN_WORKER_TAR_SHA256" "$RUN_WORKER_MANIFEST_SHA256"; do
            if ! printf '%s' "$d" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::a build digest is missing or malformed"
              exit 1
            fi
          done
          {
            printf '%s  artifact/run-web.tar\n' "$RUN_WEB_TAR_SHA256"
            printf '%s  artifact/run-web.sha256\n' "$RUN_WEB_MANIFEST_SHA256"
            printf '%s  artifact/run-worker.tar\n' "$RUN_WORKER_TAR_SHA256"
            printf '%s  artifact/run-worker.sha256\n' "$RUN_WORKER_MANIFEST_SHA256"
          } > artifact-digests.txt
          sha256sum --check --strict artifact-digests.txt
      - name: Extract and verify the production site against its manifest
        run: |
          mkdir site
          tar -xf artifact/run-web.tar -C site
          node tools/gates/src/repro/cli.ts verify site artifact/run-web.sha256
      - name: The test artifact differs from the attested artifact only in the transport seam chunk
        run: node tools/gates/src/artifact/diff-cli.ts site apps/web/dist-fake-serial
      - name: Playwright fake-serial suite against wrangler dev serving the test artifact
        run: pnpm --filter @synthetos/e2e e2e:fake-serial

  attest:
    name: attest
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # No checkout: this job runs no repository code, so nothing the build
      # executed can reach the signing identity.
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-web
          path: artifact
      - name: Check the downloaded artifact is the bytes the build job produced
        env:
          RUN_WEB_TAR_SHA256: ${{ needs.build.outputs.run-web-tar }}
          RUN_WEB_MANIFEST_SHA256: ${{ needs.build.outputs.run-web-manifest }}
          RUN_WORKER_TAR_SHA256: ${{ needs.build.outputs.run-worker-tar }}
          RUN_WORKER_MANIFEST_SHA256: ${{ needs.build.outputs.run-worker-manifest }}
        run: |
          set -euo pipefail
          for d in "$RUN_WEB_TAR_SHA256" "$RUN_WEB_MANIFEST_SHA256" "$RUN_WORKER_TAR_SHA256" "$RUN_WORKER_MANIFEST_SHA256"; do
            if ! printf '%s' "$d" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::a build digest is missing or malformed"
              exit 1
            fi
          done
          {
            printf '%s  artifact/run-web.tar\n' "$RUN_WEB_TAR_SHA256"
            printf '%s  artifact/run-web.sha256\n' "$RUN_WEB_MANIFEST_SHA256"
            printf '%s  artifact/run-worker.tar\n' "$RUN_WORKER_TAR_SHA256"
            printf '%s  artifact/run-worker.sha256\n' "$RUN_WORKER_MANIFEST_SHA256"
          } > artifact-digests.txt
          sha256sum --check --strict artifact-digests.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifact/run-web.tar
            artifact/run-web.sha256
            artifact/run-worker.tar
            artifact/run-worker.sha256

  deploy-staging:
    name: deploy-staging
    needs: [verify, build, e2e, e2e-fake-serial, attest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.run.synthetos.com
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
      actions: read
    steps:
      - name: Refuse anything but a push to main
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::deploys run only on a push to main (got $GITHUB_EVENT_NAME on $GITHUB_REF)"
            exit 1
          fi
      - name: Check out (deploy toolchain lockfile and Worker configuration)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Install wrangler (pinned version and integrity, no install scripts)
        run: pnpm --dir ci/deploy-toolchain install --frozen-lockfile --ignore-scripts
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-web
          path: artifact
      - name: Check the downloaded artifact is the bytes the build job produced
        env:
          RUN_WEB_TAR_SHA256: ${{ needs.build.outputs.run-web-tar }}
          RUN_WEB_MANIFEST_SHA256: ${{ needs.build.outputs.run-web-manifest }}
          RUN_WORKER_TAR_SHA256: ${{ needs.build.outputs.run-worker-tar }}
          RUN_WORKER_MANIFEST_SHA256: ${{ needs.build.outputs.run-worker-manifest }}
        run: |
          set -euo pipefail
          for d in "$RUN_WEB_TAR_SHA256" "$RUN_WEB_MANIFEST_SHA256" "$RUN_WORKER_TAR_SHA256" "$RUN_WORKER_MANIFEST_SHA256"; do
            if ! printf '%s' "$d" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::a build digest is missing or malformed"
              exit 1
            fi
          done
          {
            printf '%s  artifact/run-web.tar\n' "$RUN_WEB_TAR_SHA256"
            printf '%s  artifact/run-web.sha256\n' "$RUN_WEB_MANIFEST_SHA256"
            printf '%s  artifact/run-worker.tar\n' "$RUN_WORKER_TAR_SHA256"
            printf '%s  artifact/run-worker.sha256\n' "$RUN_WORKER_MANIFEST_SHA256"
          } > artifact-digests.txt
          sha256sum --check --strict artifact-digests.txt
      - name: Verify the build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in artifact/run-web.tar artifact/run-web.sha256 artifact/run-worker.tar artifact/run-worker.sha256; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Extract and verify against the manifests
        run: |
          mkdir site worker
          tar -xf artifact/run-web.tar -C site
          node tools/gates/src/repro/cli.ts verify site artifact/run-web.sha256
          tar -xf artifact/run-worker.tar -C worker
          node tools/gates/src/repro/cli.ts verify worker artifact/run-worker.sha256
      # The preflight checks the reviewed wrangler.jsonc (a positive key allowlist: no `build` in any
      # scope, since wrangler runs build.command even under --no-bundle) and writes the deployment
      # configuration from its allowlisted keys. Every wrangler call below uses only that file.
      - name: Preflight (account D39, workers.dev and preview URLs off H45)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/gates/src/deploy/preflight.ts workers/run/wrangler.jsonc staging --write workers/run/wrangler.deploy.json
      - name: Staging must already be behind Cloudflare Access (D31)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/gates/src/smoke/cli.ts --env staging --pre-deploy
      - name: Fetch the previous staging deployment state (asset retention)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: staging
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=run-deployed-$DEPLOY_ENV&per_page=100" > previous-artifacts.json
          run_id="$(node tools/gates/src/deploy/previous-cli.ts select previous-artifacts.json "$DEPLOY_ENV" "$GITHUB_REPOSITORY_ID")"
          if [ -z "$run_id" ]; then
            echo "::warning::no trusted previous $DEPLOY_ENV deployment state: no earlier assets are retained"
            echo "--no-previous" > retention-args
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > previous-run.json
            node tools/gates/src/deploy/previous-cli.ts check-run previous-run.json "$run_id" "$GITHUB_REPOSITORY_ID"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "run-deployed-$DEPLOY_ENV" --dir previous
            # The state is only a claim (any job of a main run can upload that name): every retained
            # file must be in the ATTESTED run-web manifest of the build of its commit.
            mkdir attested
            for commit in $(node tools/gates/src/deploy/previous-cli.ts commits previous/retention.json); do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&event=push&branch=main&per_page=100" > "runs-$commit.json"
              build_run="$(node tools/gates/src/deploy/previous-cli.ts select-build "runs-$commit.json" "$commit" "$GITHUB_REPOSITORY_ID")"
              if [ -z "$build_run" ] || ! gh run download "$build_run" --repo "$GITHUB_REPOSITORY" --name run-web --dir "attested-raw/$commit"; then
                echo "::warning::no attested build found for $commit: its assets are not retained"
                continue
              fi
              if gh attestation verify "attested-raw/$commit/run-web.sha256" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
                --source-ref refs/heads/main \
                --source-digest "$commit" \
                --deny-self-hosted-runners; then
                mkdir "attested/$commit"
                cp "attested-raw/$commit/run-web.sha256" "attested/$commit/run-web.sha256"
              else
                echo "::warning::the run-web manifest of $commit does not verify: its assets are not retained"
              fi
            done
            echo "--previous previous --attested attested" > retention-args
          fi
      - name: Merge hashed assets of the last 14 days (RUN_PLAN §6.3)
        env:
          DEPLOY_ENV: staging
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          node tools/gates/src/deploy/retention-cli.ts merge --env "$DEPLOY_ENV" --commit "$GITHUB_SHA" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --site site $(cat retention-args) --out deploy-site --state-out deployed-state
          node tools/gates/src/bundle/cli.ts deploy-site
      - name: Deploy the attested artifact to staging
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ci/deploy-toolchain/node_modules/.bin/wrangler deploy worker/index.mjs --no-bundle --config workers/run/wrangler.deploy.json --env staging --assets deploy-site
      - name: Post-deploy smoke test (headers, preview URLs, health, DNSSEC, CAA, certificate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RUN_WORKERS_DEV_SUBDOMAIN: ${{ vars.RUN_WORKERS_DEV_SUBDOMAIN }}
        run: node tools/gates/src/smoke/cli.ts --env staging
      - name: Undo the deployment when a step after it failed (staging is deleted, production rolled back)
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/gates/src/deploy/rollback-cli.ts staging ci/deploy-toolchain/node_modules/.bin/wrangler
      - name: Keep this deployment's assets for the next deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-deployed-staging
          path: deployed-state/
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: deploy-production
    needs: [verify, build, e2e, e2e-fake-serial, attest, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RUN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://run.synthetos.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
      actions: read
    steps:
      - name: Refuse anything but a push to main
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::deploys run only on a push to main (got $GITHUB_EVENT_NAME on $GITHUB_REF)"
            exit 1
          fi
      - name: Check out (deploy toolchain lockfile and Worker configuration)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Enable pnpm through Corepack
        run: corepack enable
      - name: Install wrangler (pinned version and integrity, no install scripts)
        run: pnpm --dir ci/deploy-toolchain install --frozen-lockfile --ignore-scripts
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: run-web
          path: artifact
      - name: Check the downloaded artifact is the bytes the build job produced
        env:
          RUN_WEB_TAR_SHA256: ${{ needs.build.outputs.run-web-tar }}
          RUN_WEB_MANIFEST_SHA256: ${{ needs.build.outputs.run-web-manifest }}
          RUN_WORKER_TAR_SHA256: ${{ needs.build.outputs.run-worker-tar }}
          RUN_WORKER_MANIFEST_SHA256: ${{ needs.build.outputs.run-worker-manifest }}
        run: |
          set -euo pipefail
          for d in "$RUN_WEB_TAR_SHA256" "$RUN_WEB_MANIFEST_SHA256" "$RUN_WORKER_TAR_SHA256" "$RUN_WORKER_MANIFEST_SHA256"; do
            if ! printf '%s' "$d" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::a build digest is missing or malformed"
              exit 1
            fi
          done
          {
            printf '%s  artifact/run-web.tar\n' "$RUN_WEB_TAR_SHA256"
            printf '%s  artifact/run-web.sha256\n' "$RUN_WEB_MANIFEST_SHA256"
            printf '%s  artifact/run-worker.tar\n' "$RUN_WORKER_TAR_SHA256"
            printf '%s  artifact/run-worker.sha256\n' "$RUN_WORKER_MANIFEST_SHA256"
          } > artifact-digests.txt
          sha256sum --check --strict artifact-digests.txt
      - name: Verify the build provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in artifact/run-web.tar artifact/run-web.sha256 artifact/run-worker.tar artifact/run-worker.sha256; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done
      - name: Extract and verify against the manifests
        run: |
          mkdir site worker
          tar -xf artifact/run-web.tar -C site
          node tools/gates/src/repro/cli.ts verify site artifact/run-web.sha256
          tar -xf artifact/run-worker.tar -C worker
          node tools/gates/src/repro/cli.ts verify worker artifact/run-worker.sha256
      # The preflight checks the reviewed wrangler.jsonc (a positive key allowlist: no `build` in any
      # scope, since wrangler runs build.command even under --no-bundle) and writes the deployment
      # configuration from its allowlisted keys. Every wrangler call below uses only that file.
      - name: Preflight (account D39, workers.dev and preview URLs off H45)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/gates/src/deploy/preflight.ts workers/run/wrangler.jsonc production --write workers/run/wrangler.deploy.json
      - name: Fetch the previous production deployment state (asset retention)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: production
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=run-deployed-$DEPLOY_ENV&per_page=100" > previous-artifacts.json
          run_id="$(node tools/gates/src/deploy/previous-cli.ts select previous-artifacts.json "$DEPLOY_ENV" "$GITHUB_REPOSITORY_ID")"
          if [ -z "$run_id" ]; then
            echo "::warning::no trusted previous $DEPLOY_ENV deployment state: no earlier assets are retained"
            echo "--no-previous" > retention-args
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > previous-run.json
            node tools/gates/src/deploy/previous-cli.ts check-run previous-run.json "$run_id" "$GITHUB_REPOSITORY_ID"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "run-deployed-$DEPLOY_ENV" --dir previous
            # The state is only a claim (any job of a main run can upload that name): every retained
            # file must be in the ATTESTED run-web manifest of the build of its commit.
            mkdir attested
            for commit in $(node tools/gates/src/deploy/previous-cli.ts commits previous/retention.json); do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&event=push&branch=main&per_page=100" > "runs-$commit.json"
              build_run="$(node tools/gates/src/deploy/previous-cli.ts select-build "runs-$commit.json" "$commit" "$GITHUB_REPOSITORY_ID")"
              if [ -z "$build_run" ] || ! gh run download "$build_run" --repo "$GITHUB_REPOSITORY" --name run-web --dir "attested-raw/$commit"; then
                echo "::warning::no attested build found for $commit: its assets are not retained"
                continue
              fi
              if gh attestation verify "attested-raw/$commit/run-web.sha256" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
                --source-ref refs/heads/main \
                --source-digest "$commit" \
                --deny-self-hosted-runners; then
                mkdir "attested/$commit"
                cp "attested-raw/$commit/run-web.sha256" "attested/$commit/run-web.sha256"
              else
                echo "::warning::the run-web manifest of $commit does not verify: its assets are not retained"
              fi
            done
            echo "--previous previous --attested attested" > retention-args
          fi
      - name: Merge hashed assets of the last 14 days (RUN_PLAN §6.3)
        env:
          DEPLOY_ENV: production
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          node tools/gates/src/deploy/retention-cli.ts merge --env "$DEPLOY_ENV" --commit "$GITHUB_SHA" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --site site $(cat retention-args) --out deploy-site --state-out deployed-state
          node tools/gates/src/bundle/cli.ts deploy-site
      - name: Deploy the attested artifact to production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ci/deploy-toolchain/node_modules/.bin/wrangler deploy worker/index.mjs --no-bundle --config workers/run/wrangler.deploy.json --assets deploy-site
      - name: Post-deploy smoke test (headers, preview URLs, health, DNSSEC, CAA, certificate)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RUN_WORKERS_DEV_SUBDOMAIN: ${{ vars.RUN_WORKERS_DEV_SUBDOMAIN }}
        run: node tools/gates/src/smoke/cli.ts --env production
      - name: Undo the deployment when a step after it failed (staging is deleted, production rolled back)
        if: failure() && steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/gates/src/deploy/rollback-cli.ts production ci/deploy-toolchain/node_modules/.bin/wrangler
      - name: Keep this deployment's assets for the next deploy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-deployed-production
          path: deployed-state/
          if-no-files-found: error
          retention-days: 30
