# Standalone pnpm project for the deploy jobs (ROADMAP P0-03). It is NOT part
# of the repository workspace: this file stops pnpm from walking up to the
# root workspace, so the deploy jobs install wrangler and nothing else.

# Refuse any package version published less than 7 days ago (minutes).
minimumReleaseAge: 10080

# No dependency may run install scripts.
onlyBuiltDependencies: []
